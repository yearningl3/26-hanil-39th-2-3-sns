<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>한일고등학교 2학년 3반 커뮤니티</title>

  <!-- PWA 매니페스트 및 모바일 앱 최적화 태그 -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#1e40af" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3820/3820331.png" />

  <!-- 파이어베이스 SDK 로드 -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <style>
    :root {
      --primary: #1e40af;
      --primary-hover: #1d4ed8;
      --notice-red: #ef4444;
      --free-green: #10b981;
      --heart-pink: #ec4899;
      --insta-grad: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
      --bg: #f1f5f9;
      --card: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
    }

    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
    }
    
    body { 
      background-color: var(--bg); 
      color: var(--text); 
      padding-bottom: 70px;
      overflow-x: hidden;
      user-select: none;
    }

    /* 상단 헤더 */
    header {
      background: var(--card);
      border-bottom: 1px solid var(--border);
      padding: 0.8rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .school-title { font-size: 1.1rem; font-weight: 800; color: var(--primary); }
    .header-user-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #e0e7ff;
      padding: 3px 8px 3px 4px;
      border-radius: 20px;
      cursor: pointer;
      border: 1px solid #c7d2fe;
    }
    .header-avatar {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      object-fit: cover;
      background: var(--primary);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      font-weight: 700;
    }
    .user-tag-text { color: var(--primary); font-weight: 700; font-size: 0.82rem; }

    /* 네비게이션 */
    nav {
      max-width: 900px;
      margin: 1rem auto 0;
      padding: 0 1rem;
      display: flex;
      gap: 0.5rem;
    }
    nav button {
      flex: 1;
      padding: 0.6rem 0;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
    }
    nav button.active { background: var(--primary); color: #fff; border-color: var(--primary); }

    /* 메인 컨테이너 */
    main { max-width: 900px; margin: 1rem auto; padding: 0 1rem; }
    .tab-view { display: none; }
    .tab-view.active { display: block; }

    /* 버튼 스타일 */
    .btn { background: var(--primary); color: white; border: none; padding: 0.5rem 1rem; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 0.85rem; transition: background 0.2s; }
    .btn:hover { background: var(--primary-hover); }
    .btn-notice { background: var(--notice-red); }
    .btn-notice:hover { background: #dc2626; }
    .btn-secondary { background: #e2e8f0; color: var(--text); }
    .btn-secondary:hover { background: #cbd5e1; }
    
    .btn-action-small {
      background: none;
      border: none;
      font-size: 0.72rem;
      cursor: pointer;
      padding: 2px 5px;
      border-radius: 3px;
      font-weight: 600;
    }
    .btn-edit-small { color: var(--primary); }
    .btn-edit-small:hover { background: #e0e7ff; }
    .btn-del-small { color: var(--notice-red); }
    .btn-del-small:hover { background: #fee2e2; }
    
    .btn-insta {
      background: var(--insta-grad);
      color: white;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 0.6rem;
      border-radius: 6px;
      font-weight: 700;
      font-size: 0.85rem;
      border: none;
      cursor: pointer;
      width: 100%;
      margin-top: 0.6rem;
    }

    /* PWA 설치 권유 바 */
    #pwaInstallBanner {
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      border-radius: 8px;
      padding: 0.7rem 1rem;
      margin-bottom: 1rem;
      display: none;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
    }

    /* 인증 폼 */
    .auth-container { max-width: 420px; margin: 3rem auto; background: var(--card); padding: 2rem; border-radius: 12px; border: 1px solid var(--border); }
    .auth-title { font-size: 1.3rem; font-weight: 700; margin-bottom: 1.2rem; text-align: center; color: var(--primary); }
    .form-group { margin-bottom: 1rem; }
    .form-group label { display: block; font-size: 0.8rem; font-weight: 600; margin-bottom: 0.3rem; }
    .form-group input { width: 100%; padding: 0.6rem; border: 1px solid var(--border); border-radius: 6px; font-size: 0.9rem; }
    .auth-switch { text-align: center; margin-top: 1rem; font-size: 0.85rem; color: var(--text-muted); cursor: pointer; text-decoration: underline; }

    /* 스토리 영역 */
    .stories-container {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1rem;
      margin-bottom: 1.2rem;
      display: flex;
      gap: 1rem;
      overflow-x: auto;
      align-items: center;
    }
    .story-item { display: flex; flex-direction: column; align-items: center; gap: 0.3rem; cursor: pointer; flex-shrink: 0; }
    .story-ring {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      padding: 2px;
      background: linear-gradient(45deg, #f59e0b, #ec4899, #8b5cf6);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .story-avatar-img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; border: 2px solid white; background: #e2e8f0; }
    .story-avatar-default { width: 100%; height: 100%; border-radius: 50%; background: #e0e7ff; display: flex; align-items: center; justify-content: center; font-weight: 700; color: var(--primary); border: 2px solid white; font-size: 0.9rem; }
    .story-user { font-size: 0.75rem; color: var(--text); }

    /* 게시판 스타일 (줄바꿈 오류 완전 해결) */
    .board-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; flex-wrap: wrap; gap: 0.5rem; }
    .filter-btn-group { display: flex; gap: 0.3rem; }
    .filter-btn { padding: 0.35rem 0.75rem; border: 1px solid var(--border); background: white; border-radius: 20px; font-size: 0.8rem; cursor: pointer; }
    .filter-btn.active { background: var(--text); color: white; border-color: var(--text); }
    .post-list { display: flex; flex-direction: column; gap: 0.8rem; }
    
    .post-card { 
      background: var(--card); 
      border: 1px solid var(--border); 
      border-radius: 8px; 
      padding: 1.1rem; 
      overflow: hidden;
      word-break: break-all;
      overflow-wrap: anywhere;
    }
    
    .badge { font-size: 0.75rem; font-weight: 700; padding: 2px 6px; border-radius: 4px; }
    .badge-notice { background: #fee2e2; color: var(--notice-red); }
    .badge-free { background: #d1fae5; color: var(--free-green); }
    .author-wrapper { display: flex; align-items: center; gap: 6px; cursor: pointer; }
    .author-thumb { width: 20px; height: 20px; border-radius: 50%; object-fit: cover; background: #e0e7ff; display: inline-flex; align-items: center; justify-content: center; font-size: 0.65rem; font-weight: 700; color: var(--primary); }
    .author-link { color: var(--primary); font-weight: 700; text-decoration: none; font-size: 0.8rem; }
    .author-link:hover { text-decoration: underline; }

    /* 인스타그램 전용 인앱 카드 및 딥링크 뷰어 */
    .insta-preview-card {
      margin: 0.8rem 0;
      background: #fafafa;
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
    }
    .insta-card-header {
      padding: 0.6rem 0.8rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: white;
      border-bottom: 1px solid var(--border);
      font-size: 0.8rem;
      font-weight: 700;
    }
    .insta-direct-frame {
      width: 100%;
      height: 440px;
      border: none;
      display: block;
      background: #fff;
    }

    .post-link {
      color: var(--primary);
      text-decoration: underline;
      word-break: break-all;
      overflow-wrap: anywhere;
    }

    /* 좋아요 및 댓글 UI */
    .interaction-bar {
      display: flex;
      gap: 1rem;
      align-items: center;
      margin-top: 0.8rem;
      padding-top: 0.6rem;
      border-top: 1px solid var(--border);
      font-size: 0.82rem;
    }
    .action-btn {
      background: none;
      border: none;
      display: flex;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      color: var(--text-muted);
      font-weight: 600;
      font-size: 0.82rem;
    }
    .action-btn.liked { color: var(--heart-pink); }
    .action-btn:hover { opacity: 0.8; }

    .comment-section {
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.8rem;
      margin-top: 0.8rem;
      display: none;
    }
    .comment-list { display: flex; flex-direction: column; gap: 0.5rem; margin-bottom: 0.6rem; max-height: 180px; overflow-y: auto; }
    .comment-item { 
      font-size: 0.8rem; 
      line-height: 1.4; 
      display: flex; 
      justify-content: space-between; 
      align-items: flex-start;
      word-break: break-all;
      overflow-wrap: anywhere;
    }
    .comment-form { display: flex; gap: 0.4rem; }
    .comment-form input { flex: 1; padding: 0.4rem 0.6rem; font-size: 0.8rem; border: 1px solid var(--border); border-radius: 4px; }

    /* 실시간 톡 스타일 */
    .chat-box { background: var(--card); border: 1px solid var(--border); border-radius: 12px; height: 480px; display: flex; flex-direction: column; }
    .chat-messages { flex: 1; padding: 1rem; overflow-y: auto; display: flex; flex-direction: column; gap: 0.8rem; }
    .chat-bubble { 
      max-width: 75%; 
      padding: 0.6rem 0.9rem; 
      border-radius: 10px; 
      font-size: 0.9rem; 
      word-break: break-all;
      overflow-wrap: anywhere;
    }
    .chat-bubble.mine { align-self: flex-end; background: var(--primary); color: white; display: flex; align-items: center; gap: 8px; }
    .chat-bubble.others { align-self: flex-start; background: #f1f5f9; border: 1px solid var(--border); }
    .chat-del-btn { background: none; border: none; color: rgba(255, 255, 255, 0.7); cursor: pointer; font-size: 0.75rem; padding: 0 2px; }
    .chat-del-btn:hover { color: #fee2e2; }
    .chat-input-row { padding: 0.8rem; border-top: 1px solid var(--border); display: flex; gap: 0.5rem; }
    .chat-input-row input { flex: 1; padding: 0.6rem; border: 1px solid var(--border); border-radius: 6px; }

    /* 캘린더 스타일 */
    .calendar-wrap { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 1.2rem; }
    .cal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
    .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; }
    .cal-day-head { font-weight: 700; font-size: 0.8rem; padding: 0.4rem 0; color: var(--text-muted); }
    .cal-cell { min-height: 85px; border: 1px solid var(--border); border-radius: 6px; padding: 0.3rem; text-align: left; background: white; font-size: 0.8rem; cursor: pointer; transition: background 0.1s; display: flex; flex-direction: column; gap: 2px; }
    .cal-cell:hover { background: #f8fafc; }
    .cal-cell.today { border: 2px solid var(--primary); font-weight: 700; }
    .cal-event-chip { background: #e0e7ff; color: var(--primary); font-size: 0.68rem; padding: 2px 4px; border-radius: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }

    /* 모달 공통 */
    .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: none; justify-content: center; align-items: center; z-index: 200; padding: 1rem; }
    .modal-content { background: white; border-radius: 12px; width: 100%; max-width: 460px; padding: 1.5rem; }

    /* 상태 표시 바 */
    #systemStatusBar {
      position: fixed;
      bottom: 10px;
      left: 10px;
      right: 10px;
      max-width: 420px;
      margin: 0 auto;
      background: #1e293b;
      color: #f8fafc;
      padding: 0.5rem 1rem;
      border-radius: 20px;
      font-size: 0.78rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
      z-index: 999;
    }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #eab308; margin-right: 6px; display: inline-block; }
  </style>
</head>
<body>

  <!-- 헤더 -->
  <header>
    <div class="school-title">한일고 2학년 3반</div>
    <div id="headerAuth"></div>
  </header>

  <!-- 1. 비로그인 영역 -->
  <div id="authSection" class="auth-container" style="display: none;">
    <div id="loginFormArea">
      <div class="auth-title">2학년 3반 로그인</div>
      <form onsubmit="handleLogin(event)">
        <div class="form-group">
          <label>학교 이메일 (@hanilgo.cnehs.kr)</label>
          <input type="email" id="loginEmail" placeholder="2025xxxx@hanilgo.cnehs.kr" required />
        </div>
        <div class="form-group">
          <label>비밀번호</label>
          <input type="password" id="loginPw" required />
        </div>
        <button type="submit" class="btn" style="width:100%; padding:0.7rem;">로그인</button>
      </form>
      <div class="auth-switch" onclick="toggleAuthForm('signup')">처음이신가요? 학교 계정으로 회원가입하기</div>
    </div>

    <div id="signupFormArea" style="display: none;">
      <div class="auth-title">학급 계정 회원가입</div>
      <form onsubmit="handleSignUp(event)">
        <div class="form-group">
          <label>학교 이메일</label>
          <input type="email" id="signupEmail" placeholder="본인의 학교 구글 계정 입력" required />
        </div>
        <div class="form-group">
          <label>사용할 SNS 아이디 (영문/숫자/밑줄)</label>
          <input type="text" id="signupHandle" placeholder="예: youngmin_23" pattern="^[a-zA-Z0-9_]{3,15}$" title="3~15자의 영문, 숫자, 밑줄만 사용 가능합니다." required />
        </div>
        <div class="form-group">
          <label>비밀번호 (6자리 이상)</label>
          <input type="password" id="signupPw" minlength="6" required />
        </div>
        <button type="submit" class="btn" style="width:100%; padding:0.7rem;">인증 메일 발송 및 가입</button>
      </form>
      <div class="auth-switch" onclick="toggleAuthForm('login')">이미 계정이 있으신가요? 로그인하기</div>
    </div>
  </div>

  <!-- 2. 메인 서비스 화면 -->
  <div id="mainServiceSection" style="display: none;">
    <nav>
      <button class="active" onclick="switchTab('board', this)">📢 통합 게시판</button>
      <button onclick="switchTab('chat', this)">💬 실시간 톡</button>
      <button onclick="switchTab('calendar', this)">📅 학급 캘린더</button>
    </nav>

    <main>
      <!-- PWA 앱 설치 유도 배너 -->
      <div id="pwaInstallBanner">
        <span>📲 <strong>한일 2-3 전용 앱</strong>으로 설치하여 차단 없이 사용하세요!</span>
        <button class="btn" style="padding:4px 10px; font-size:0.75rem;" onclick="triggerPwaInstall()">앱 설치</button>
      </div>

      <!-- 스토리 영역 -->
      <div class="stories-container">
        <div class="story-item" onclick="openModal('storyModal')">
          <div class="story-ring" style="background:#2563eb;">
            <div class="story-avatar-default" style="font-size:1.3rem;">+</div>
          </div>
          <span class="story-user">스토리 추가</span>
        </div>
        <div id="storyList" style="display: flex; gap: 1rem;"></div>
      </div>

      <!-- 1. 통합 게시판 탭 -->
      <section id="tab-board" class="tab-view active">
        <div class="board-header">
          <div class="filter-btn-group">
            <button class="filter-btn active" onclick="filterBoardCategory('all', this)">전체보기</button>
            <button class="filter-btn" onclick="filterBoardCategory('notice', this)">📢 공지사항</button>
            <button class="filter-btn" onclick="filterBoardCategory('free', this)">💬 자유게시판</button>
          </div>
          <div id="boardActionButtons" style="display: flex; gap: 0.4rem;"></div>
        </div>
        <div class="post-list" id="postList"></div>
      </section>

      <!-- 2. 실시간 톡 탭 -->
      <section id="tab-chat" class="tab-view">
        <div class="chat-box">
          <div class="chat-messages" id="chatMessages"></div>
          <form class="chat-input-row" onsubmit="handleSendChat(event)">
            <input type="text" id="chatInput" placeholder="메시지를 입력하세요..." required />
            <button type="submit" class="btn">전송</button>
          </form>
        </div>
      </section>

      <!-- 3. 학급 캘린더 탭 -->
      <section id="tab-calendar" class="tab-view">
        <div class="calendar-wrap">
          <div class="cal-header">
            <button class="btn btn-secondary" onclick="changeCalMonth(-1)">&lt; 이전달</button>
            <h3 id="calTitle"></h3>
            <button class="btn btn-secondary" onclick="changeCalMonth(1)">다음달 &gt;</button>
          </div>
          <div class="cal-grid">
            <div class="cal-day-head" style="color:red;">일</div>
            <div class="cal-day-head">월</div>
            <div class="cal-day-head">화</div>
            <div class="cal-day-head">수</div>
            <div class="cal-day-head">목</div>
            <div class="cal-day-head">금</div>
            <div class="cal-day-head" style="color:blue;">토</div>
          </div>
          <div class="cal-grid" id="calendarCells"></div>
        </div>
      </section>
    </main>
  </div>

  <!-- 프로필 상세 조회 모달 -->
  <div class="modal-backdrop" id="profileModal" onclick="closeModal('profileModal')">
    <div class="modal-content" onclick="event.stopPropagation()">
      <div style="text-align: center; margin-bottom: 1.2rem;">
        <div id="profAvatarContainer" style="width:80px; height:80px; margin:0 auto 0.8rem;"></div>
        <h3 id="profHandle" style="color:var(--primary); font-size:1.2rem;"></h3>
      </div>
      <div style="background:#f8fafc; border:1px solid var(--border); border-radius:8px; padding:1rem; line-height:1.8;">
        <div><strong>실제 이름:</strong> <span id="profRealName"></span></div>
        <div><strong>학급 역할:</strong> <span id="profRole"></span></div>
        <div id="profInstaArea" style="margin-top:0.3rem;"></div>
      </div>
      <div id="profActionArea" style="margin-top:1rem; display:flex; gap:0.5rem;">
        <button class="btn btn-secondary" style="flex:1;" onclick="closeModal('profileModal')">닫기</button>
      </div>
    </div>
  </div>

  <!-- 내 프로필 및 인스타그램 설정 모달 -->
  <div class="modal-backdrop" id="editProfileModal">
    <div class="modal-content">
      <h3 style="margin-bottom:1rem;">내 프로필 설정</h3>
      <form onsubmit="handleSaveProfileSettings(event)">
        <div style="text-align:center; margin-bottom:1rem;">
          <label style="font-size:0.8rem; font-weight:600; display:block; margin-bottom:0.4rem;">프로필 사진</label>
          <div id="editPhotoPreview" style="width:90px; height:90px; border-radius:50%; margin:0 auto 0.8rem; background:#e0e7ff; display:flex; align-items:center; justify-content:center; overflow:hidden; border:2px solid var(--primary);"></div>
          <input type="file" id="profilePhotoFileInput" accept="image/*" onchange="previewProfilePhoto(event)" style="font-size:0.8rem;" />
        </div>
        
        <div class="form-group" style="margin-top:1rem;">
          <label>인스타그램 아이디 (@ 제외 입력)</label>

    function formatPostContent(rawText) {
      if (!rawText) return '';

      let escaped = escapeHtml(rawText);

      // 인스타그램 URL 감지 정규식
      const instaRegex = /(https?:\/\/(?:www\.)?instagram\.com\/(?:p|reel|tv)\/([a-zA-Z0-9_\-]+)\/?(?:\S*))/gi;

      escaped = escaped.replace(instaRegex, (match, fullUrl, shortcode) => {
        const embedSrc = `https://www.instagram.com/p/${shortcode}/embed/`;
        // 앱 내 딥링크 호출 주소
        const appIntentUrl = `intent://instagram.com/p/${shortcode}/#Intent;package=com.instagram.android;scheme=https;end`;

        return `
          <div class="insta-preview-card">
            <div class="insta-card-header">
              <span>📸 Instagram 피드 미리보기</span>
              <a href="${appIntentUrl}" class="btn" style="padding:2px 8px; font-size:0.72rem; background:var(--insta-grad);">앱에서 열기</a>
            </div>
            <iframe class="insta-direct-frame" src="${embedSrc}" frameborder="0" scrolling="no" allowtransparency="true" allow="encrypted-media"></iframe>
          </div>
        `;
      });

      // 일반 웹 링크 줄바꿈 처리
      const generalUrlRegex = /(?<!src=["'])(https?:\/\/[^\s<]+)(?![^<]*>)/gi;
      escaped = escaped.replace(generalUrlRegex, (url) => {
        if (url.includes('instagram.com/p/') || url.includes('instagram.com/reel/')) return url;
        return `<a href="${url}" target="_blank" class="post-link">${url}</a>`;
      });

      return escaped;
    }

    // =========================================================================

    // =========================================================================
    function compressImage(file, maxWidth = 600, quality = 0.7) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = event => {
          const img = new Image();
          img.src = event.target.result;
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let width = img.width;
            let height = img.height;
            if (width > maxWidth) {
              height = Math.round((height * maxWidth) / width);
              width = maxWidth;
            }
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            resolve(canvas.toDataURL('image/jpeg', quality));
          };
          img.onerror = err => reject(err);
        };
        reader.onerror = err => reject(err);
      });
    }

    async function handleSaveProfileSettings(e) {

      if (!myProfile) return;

      btn.disabled = true;

        };

    async function showProfile(handle) {
      const handleDoc = await db.collection('handles').doc(handle).get();
      if (!handleDoc.exists) return alert("존재하지 않는 사용자입니다.");

      const uid = handleDoc.data().uid;
      const userDoc = await db.collection('users').doc(uid).get();
      if (!userDoc.exists) return;

      const prof = userDoc.data();
      const container = document.getElementById('profAvatarContainer');
      if (prof.photoBase64) {
        container.innerHTML = `<img src="${prof.photoBase64}" style="width:100%; height:100%; border-radius:50%; object-fit:cover; border:2px solid var(--primary);" />`;
      } else {
        container.innerHTML = `<div style="width:100%; height:100%; border-radius:50%; background:#e0e7ff; color:var(--primary); font-size:1.8rem; font-weight:700; display:flex; align-items:center; justify-content:center; border:2px solid var(--primary);">${prof.handle.charAt(0).toUpperCase()}</div>`;
      }

      document.getElementById('profHandle').textContent = `@${prof.handle}`;
      document.getElementById('profRealName').textContent = prof.name;
      document.getElementById('profRole').textContent = prof.role;

      const instaArea = document.getElementById('profInstaArea');
      if (prof.instagramHandle) {
        const appIntentUrl = `intent://instagram.com/_u/${prof.instagramHandle}/#Intent;package=com.instagram.android;scheme=https;end`;
        instaArea.innerHTML = `
          <a href="${appIntentUrl}" class="btn-insta">
            <span>📸 Instagram: @${prof.instagramHandle}</span>
          </a>
        `;
      } else {
        instaArea.innerHTML = '';
      }

      const actionArea = document.getElementById('profActionArea');
      const isMe = myProfile && myProfile.handle === prof.handle;
      if (isMe) {
        actionArea.innerHTML = `
          <button class="btn" style="flex:1;" onclick="openEditProfileModal()">⚙️ 프로필 / 인스타 설정</button>
          <button class="btn btn-secondary" style="flex:1;" onclick="closeModal('profileModal')">닫기</button>
        `;
      } else {
        actionArea.innerHTML = `
          <button class="btn btn-secondary" style="flex:1;" onclick="closeModal('profileModal')">닫기</button>
        `;
      }

      openModal('profileModal');
    }

      const isLeader = myProfile.role === '반장' || myProfile.role === '부반장';
      const catGroup = document.getElementById('postCatGroup');
      const catSelect = document.getElementById('postCat');
      const modalTitle = document.getElementById('writeModalTitle');

      if (categoryMode === 'notice' && isLeader) {
        modalTitle.textContent = "📢 새 학급 공지사항 작성";
        catSelect.value = 'notice';
        catGroup.style.display = 'block';
      } else {
        modalTitle.textContent = "💬 새 자유글 작성";
        catSelect.value = 'free';
        catGroup.style.display = isLeader ? 'block' : 'none';
      }

      document.getElementById('postTitle').value = '';
      document.getElementById('postContent').value = '';
      openModal('writeModal');
    }

    async function handlePostSubmit(e) {
      e.preventDefault();
      const isLeader = myProfile.role === '반장' || myProfile.role === '부반장';
      let cat = document.getElementById('postCat').value;
      if (cat === 'notice' && !isLeader) cat = 'free';

      const title = document.getElementById('postTitle').value.trim();
      const content = document.getElementById('postContent').value.trim();
      if (!title || !content) return;

      await db.collection('posts').add({
        category: cat,
        title: title,
        content: content,
        authorHandle: myProfile.handle,
        authorPhoto: myProfile.photoBase64 || null,
        likes: [],
        comments: [],
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });

      closeModal('writeModal');
      updateSystemStatus("게시글 등록 완료", "#10b981");
    }

    function openEditPostModal(postId) {
      const post = loadedPosts.find(p => p.id === postId);
      if (!post || !myProfile || post.authorHandle !== myProfile.handle) {
        return alert("본인이 작성한 글만 수정할 수 있습니다.");
      }

      const isLeader = myProfile.role === '반장' || myProfile.role === '부반장';
      document.getElementById('editPostId').value = post.id;
      document.getElementById('editPostTitle').value = post.title;
      document.getElementById('editPostContent').value = post.content;
      document.getElementById('editPostCat').value = post.category || 'free';
      document.getElementById('editPostCatGroup').style.display = isLeader ? 'block' : 'none';

      openModal('editPostModal');

    async function handleUpdatePostSubmit(e) {
      e.preventDefault();
      const postId = document.getElementById('editPostId').value;
      const title = document.getElementById('editPostTitle').value.trim();
      const content = document.getElementById('editPostContent').value.trim();
      const category = document.getElementById('editPostCat').value;

      if (!title || !content) return;

      const btn = document.getElementById('updatePostBtn');
      btn.textContent = "수정 중...";

      try {
        await db.collection('posts').doc(postId).update({
          title: title,
          content: content,
          category: category,
          updatedAt: firebase.firestore.FieldValue.serverTimestamp()
        });
        closeModal('editPostModal');

    function filterBoardCategory(cat, btn) {
      currentBoardFilter = cat;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderPostList();

    let loadedPosts = [];
    function listenToPosts() {
      db.collection('posts').orderBy('createdAt', 'desc').onSnapshot(snapshot => {
        loadedPosts = [];

          loadedPosts.push({ id: doc.id, ...doc.data() });

    function renderPostList() {
      const listEl = document.getElementById('postList');
      listEl.innerHTML = '';

      const filtered = loadedPosts.filter(p => currentBoardFilter === 'all' || p.category === currentBoardFilter);

      if (filtered.length === 0) {
        listEl.innerHTML = '<div style="text-align:center; padding:2rem; color:var(--text-muted);">등록된 글이 없습니다.</div>';
        return;
      }

      filtered.forEach(post => {
        const card = document.createElement('div');
        card.className = 'post-card';
        const isNotice = post.category === 'notice';
        const likes = post.likes || [];
        const isLiked = myProfile && likes.includes(myProfile.handle);
        const comments = post.comments || [];
        const isMyPost = myProfile && post.authorHandle === myProfile.handle;

        const authorAvatarHtml = post.authorPhoto 
          ? `<img src="${post.authorPhoto}" class="author-thumb" />`
          : `<div class="author-thumb">${post.authorHandle.charAt(0).toUpperCase()}</div>`;

        const formattedContent = formatPostContent(post.content);

        card.innerHTML = `
          <div style="display:flex; justify-content:space-between; align-items:flex-start;">
            <div>
              <span class="badge ${isNotice ? 'badge-notice' : 'badge-free'}">${isNotice ? '📢 공지' : '💬 자유'}</span>
              <strong style="margin-left: 6px; font-size:1rem;">${escapeHtml(post.title)}</strong>
            </div>
            ${isMyPost ? `
              <div style="display:flex; gap:2px;">
                <button class="btn-action-small btn-edit-small" onclick="openEditPostModal('${post.id}')">수정</button>
                <button class="btn-action-small btn-del-small" onclick="handleDeletePost('${post.id}')">삭제</button>
              </div>
            ` : ''}
          </div>
          <div style="font-size:0.88rem; color:#475569; margin:0.6rem 0; line-height:1.6; white-space: pre-line;">${formattedContent}</div>
          
          <div style="font-size:0.75rem; color:var(--text-muted); display:flex; align-items:center; gap:6px;">
            <span>작성자:</span>
            <div class="author-wrapper" onclick="showProfile('${post.authorHandle}')">
              ${authorAvatarHtml}
              <span class="author-link">@${post.authorHandle}</span>
            </div>
          </div>

          <div class="interaction-bar">
            <button class="action-btn ${isLiked ? 'liked' : ''}" onclick="handleTogglePostLike('${post.id}')">
              <span>${isLiked ? '❤️' : '🤍'}</span> 좋아요 <span>${likes.length}</span>
            </button>
            <button class="action-btn" onclick="toggleCommentBox('${post.id}')">
              <span>💬</span> 댓글 <span>${comments.length}</span>
            </button>
          </div>

          <div class="comment-section" id="commentBox-${post.id}">
            <div class="comment-list" id="commentList-${post.id}">
              ${comments.length === 0 ? '<div style="color:var(--text-muted); font-size:0.75rem;">첫 댓글을 남겨보세요!</div>' : comments.map((c, index) => {
                const isMyComment = myProfile && c.authorHandle === myProfile.handle;
                return `
                  <div class="comment-item">
                    <div>
                      <span class="author-link" onclick="showProfile('${c.authorHandle}')">@${c.authorHandle}</span>:
                      <span>${escapeHtml(c.text)}</span>
                      <span style="font-size:0.7rem; color:var(--text-muted); margin-left:4px;">${c.time || ''}</span>
                    </div>
                    ${isMyComment ? `<button class="btn-action-small btn-del-small" onclick="handleDeletePostComment('${post.id}', ${index})">삭제</button>` : ''}
                  </div>
                `;
              }).join('')}
            </div>
            <form class="comment-form" onsubmit="handleAddPostComment(event, '${post.id}')">
              <input type="text" id="commentInput-${post.id}" placeholder="댓글을 입력하세요..." required />
              <button type="submit" class="btn" style="padding:0.3rem 0.6rem; font-size:0.75rem;">등록</button>
            </form>
          </div>
        `;
        listEl.appendChild(card);
      });

    async function handleDeletePost(postId) {
      const post = loadedPosts.find(p => p.id === postId);
      if (!post || !myProfile || post.authorHandle !== myProfile.handle) {
        return alert("본인이 작성한 글만 삭제할 수 있습니다.");
      }

      if (confirm("이 게시글을 삭제하시겠습니까?")) {
        await db.collection('posts').doc(postId).delete();
        updateSystemStatus("게시글 삭제 완료", "#64748b");
      }
    }

    async function handleTogglePostLike(postId) {
      if (!myProfile) return;
      const post = loadedPosts.find(p => p.id === postId);
      if (!post) return;

      const postRef = db.collection('posts').doc(postId);
      const isLiked = post.likes && post.likes.includes(myProfile.handle);

      if (isLiked) {
        await postRef.update({ likes: firebase.firestore.FieldValue.arrayRemove(myProfile.handle) });
      } else {
        await postRef.update({ likes: firebase.firestore.FieldValue.arrayUnion(myProfile.handle) });
      }
    }

    function toggleCommentBox(postId) {
      const box = document.getElementById(`commentBox-${postId}`);
      if (box) {
        box.style.display = box.style.display === 'block' ? 'none' : 'block';
      }
    }

    async function handleAddPostComment(e, postId) {
      e.preventDefault();
      const input = document.getElementById(`commentInput-${postId}`);
      const text = input.value.trim();
      if (!text || !myProfile) return;

      const nowStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      await db.collection('posts').doc(postId).update({
        comments: firebase.firestore.FieldValue.arrayUnion({
          authorHandle: myProfile.handle,
          text: text,
          time: nowStr
        })
      });
      input.value = '';
    }

    async function handleDeletePostComment(postId, commentIndex) {
      const post = loadedPosts.find(p => p.id === postId);
      if (!post || !myProfile) return;

      const targetComment = post.comments[commentIndex];
      if (!targetComment || targetComment.authorHandle !== myProfile.handle) {
        return alert("본인이 작성한 댓글만 삭제할 수 있습니다.");
      }

      if (confirm("댓글을 삭제하시겠습니까?")) {
        const updatedComments = [...post.comments];
        updatedComments.splice(commentIndex, 1);
        await db.collection('posts').doc(postId).update({ comments: updatedComments });
        updateSystemStatus("댓글 삭제 완료", "#64748b");
      }
    }

    function listenToCalendarEvents() {
      db.collection('events').orderBy('createdAt', 'asc').onSnapshot(snapshot => {
        allCalendarEvents = [];
        snapshot.forEach(doc => {
          allCalendarEvents.push({ id: doc.id, ...doc.data() });
        });
        renderCalendar();
      });
    }

    function renderCalendar() {
      const year = calDate.getFullYear();
      const month = calDate.getMonth();
      document.getElementById('calTitle').textContent = `${year}년 ${month + 1}월`;

      const grid = document.getElementById('calendarCells');
      grid.innerHTML = '';

      const firstDay = new Date(year, month, 1).getDay();
      const lastDate = new Date(year, month + 1, 0).getDate();

      for (let i = 0; i < firstDay; i++) {
        const empty = document.createElement('div');
        empty.className = 'cal-cell';
        empty.style.opacity = '0.3';
        empty.style.cursor = 'default';
        grid.appendChild(empty);
      }

      const todayStr = new Date().toISOString().slice(0, 10);
      for (let d = 1; d <= lastDate; d++) {
        const cell = document.createElement('div');
        cell.className = 'cal-cell';
        const dStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
        if (dStr === todayStr) cell.classList.add('today');

        cell.innerHTML = `<div>${d}</div>`;

        const dayEvents = allCalendarEvents.filter(e => e.date === dStr);
        dayEvents.forEach(evt => {
          const chip = document.createElement('div');
          chip.className = 'cal-event-chip';
          chip.textContent = evt.title;
          cell.appendChild(chip);
        });

        cell.onclick = () => openCalendarDateModal(dStr);
        grid.appendChild(cell);
      }
    }

    function changeCalMonth(delta) {
      calDate.setMonth(calDate.getMonth() + delta);
      renderCalendar();
    }

    function openCalendarDateModal(dateStr) {
      document.getElementById('calSelectedDate').value = dateStr;
      document.getElementById('calModalDateTitle').textContent = `📅 ${dateStr} 학급 일정`;
      document.getElementById('calEventTitleInput').value = '';

      const isLeader = myProfile && (myProfile.role === '반장' || myProfile.role === '부반장');
      document.getElementById('calAdminArea').style.display = isLeader ? 'block' : 'none';
      document.getElementById('calMemberNote').style.display = isLeader ? 'none' : 'block';

      renderCalendarModalEventList(dateStr);
      openModal('calendarEventModal');
    }

    function renderCalendarModalEventList(dateStr) {
      const listEl = document.getElementById('calModalEventList');
      const dayEvents = allCalendarEvents.filter(e => e.date === dateStr);
      const isLeader = myProfile && (myProfile.role === '반장' || myProfile.role === '부반장');

      if (dayEvents.length === 0) {
        listEl.innerHTML = '<div style="color:var(--text-muted); font-size:0.85rem;">등록된 일정이 없습니다.</div>';
        return;
      }

      listEl.innerHTML = dayEvents.map(evt => `
        <div style="display:flex; justify-content:space-between; align-items:center; background:#f8fafc; padding:0.5rem 0.8rem; border-radius:6px; border:1px solid var(--border);">
          <span style="font-size:0.85rem; font-weight:600;">• ${escapeHtml(evt.title)}</span>
          ${isLeader ? `<button class="btn btn-secondary" style="padding:2px 6px; font-size:0.75rem; color:var(--notice-red);" onclick="handleDeleteCalendarEvent('${evt.id}', '${dateStr}')">삭제</button>` : ''}
        </div>
      `).join('');
    }

    async function handleAddCalendarEvent(e) {
      e.preventDefault();
      const isLeader = myProfile && (myProfile.role === '반장' || myProfile.role === '부반장');
      if (!isLeader) return alert("일정 등록 권한이 없습니다.");

      const dateStr = document.getElementById('calSelectedDate').value;
      const title = document.getElementById('calEventTitleInput').value.trim();

      await db.collection('events').add({
        date: dateStr,
        title: title,
        authorHandle: myProfile.handle,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });

      document.getElementById('calEventTitleInput').value = '';
      updateSystemStatus("학급 일정 추가됨", "#10b981");
      renderCalendarModalEventList(dateStr);
    }

    async function handleDeleteCalendarEvent(eventId, dateStr) {
      const isLeader = myProfile && (myProfile.role === '반장' || myProfile.role === '부반장');
      if (!isLeader) return alert("삭제 권한이 없습니다.");

      if (confirm("이 일정을 삭제하시겠습니까?")) {
        await db.collection('events').doc(eventId).delete();
        updateSystemStatus("일정 삭제됨", "#64748b");
        renderCalendarModalEventList(dateStr);
      }
    }

    async function handleStoryUpload(e) {
      e.preventDefault();
      const file = document.getElementById('storyFile').files[0];
      const caption = document.getElementById('storyCaption').value;
      if (!file) return;

      const btn = document.getElementById('storyUploadBtn');
      btn.textContent = "압축 및 업로드 중...";
      btn.disabled = true;

      try {
        const compressedBase64 = await compressImage(file, 600, 0.7);
        await db.collection('stories').add({
          imageBase64: compressedBase64,
          caption: caption,
          authorHandle: myProfile.handle,
          authorPhoto: myProfile.photoBase64 || null,
          likes: [],
          comments: [],
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });
        closeModal('storyModal');
        document.getElementById('storyFile').value = '';
        document.getElementById('storyCaption').value = '';
        updateSystemStatus("스토리 업로드 성공", "#10b981");
      } catch (err) {
        alert("스토리 업로드 오류: " + err.message);
      } finally {
        btn.textContent = "업로드";
        btn.disabled = false;
      }
    }

    let loadedStories = [];
    function listenToStories() {
      db.collection('stories').orderBy('createdAt', 'desc').limit(25).onSnapshot(snapshot => {
        const storyList = document.getElementById('storyList');
        storyList.innerHTML = '';
        loadedStories = [];

        const now = new Date();
        const twentyFourHoursAgo = new Date(now.getTime() - (24 * 60 * 60 * 1000));

        snapshot.forEach(doc => {
          const data = doc.data();
          let createdAtDate = null;
          if (data.createdAt && data.createdAt.toDate) {
            createdAtDate = data.createdAt.toDate();
          } else if (data.createdAt) {
            createdAtDate = new Date(data.createdAt);
          }

          if (!createdAtDate || createdAtDate >= twentyFourHoursAgo) {
            const s = { id: doc.id, ...data, createdAtDate: createdAtDate };
            loadedStories.push(s);

            const item = document.createElement('div');
            item.className = 'story-item';

            const avatarInsideRing = s.authorPhoto 
              ? `<img src="${s.authorPhoto}" class="story-avatar-img" />`
              : `<div class="story-avatar-default">${s.authorHandle.charAt(0).toUpperCase()}</div>`;

            item.innerHTML = `
              <div class="story-ring">
                ${avatarInsideRing}
              </div>
              <span class="story-user">@${s.authorHandle}</span>
            `;
            item.onclick = () => viewStory(s.id);
            storyList.appendChild(item);
          }
        });

        if (currentViewingStory) {
          const updated = loadedStories.find(s => s.id === currentViewingStory.id);
          if (updated) renderStoryModalContent(updated);
        }
      });
    }

    function getTimeAgoString(date) {
      if (!date) return "방금 전";
      const diffMinutes = Math.floor((new Date() - date) / (1000 * 60));
      if (diffMinutes < 1) return "방금 전";
      if (diffMinutes < 60) return `${diffMinutes}분 전`;
      const diffHours = Math.floor(diffMinutes / 60);
      return `${diffHours}시간 전`;
    }

    function viewStory(storyId) {
      const story = loadedStories.find(s => s.id === storyId);
      if (!story) return;
      currentViewingStory = story;
      renderStoryModalContent(story);
      openModal('storyViewerModal');
    }

    function renderStoryModalContent(s) {
      const header = document.getElementById('storyViewerHeader');
      const media = document.getElementById('storyViewerMedia');
      const cap = document.getElementById('storyViewerCaption');
      const likeCount = document.getElementById('storyLikeCount');
      const heartIcon = document.getElementById('storyHeartIcon');
      const commentCount = document.getElementById('storyCommentCount');
      const commentList = document.getElementById('storyCommentList');

      const timeAgo = getTimeAgoString(s.createdAtDate);
      const isMyStory = myProfile && s.authorHandle === myProfile.handle;

      const storyHeaderAvatar = s.authorPhoto
        ? `<img src="${s.authorPhoto}" style="width:26px; height:26px; border-radius:50%; object-fit:cover;" />`
        : `<div style="width:26px; height:26px; border-radius:50%; background:#e0e7ff; color:var(--primary); font-size:0.75rem; font-weight:700; display:flex; align-items:center; justify-content:center;">${s.authorHandle.charAt(0).toUpperCase()}</div>`;

      header.innerHTML = `
        <div style="display:flex; align-items:center; gap:8px;">
          ${storyHeaderAvatar}
          <span style="font-weight:700; color:#fff; cursor:pointer;" onclick="showProfile('${s.authorHandle}')">@${s.authorHandle}</span>
          <span style="font-size:0.75rem; color:#94a3b8;">• ${timeAgo}</span>
        </div>
        <div style="display:flex; align-items:center; gap:0.4rem;">
          <span style="font-size:0.75rem; color:#ec4899; font-weight:600;">24h</span>
          ${isMyStory ? `<button class="btn-action-small btn-del-small" style="background:#fee2e2; padding:2px 6px;" onclick="handleDeleteStory('${s.id}')">삭제</button>` : ''}
        </div>
      `;
      cap.textContent = s.caption || '';
      media.innerHTML = `<img src="${s.imageBase64}" style="max-width:100%; max-height:320px; border-radius:8px; object-fit:contain;" />`;

      const likes = s.likes || [];
      const isLiked = myProfile && likes.includes(myProfile.handle);
      likeCount.textContent = likes.length;
      heartIcon.textContent = isLiked ? '❤️' : '🤍';

      const comments = s.comments || [];
      commentCount.textContent = comments.length;

      if (comments.length === 0) {
        commentList.innerHTML = '<div style="color:#94a3b8; font-size:0.75rem;">작성된 댓글이 없습니다.</div>';
      } else {
        commentList.innerHTML = comments.map((c, index) => {
          const isMyComment = myProfile && c.authorHandle === myProfile.handle;
          return `
            <div style="display:flex; justify-content:space-between; align-items:center;">
              <div>
                <span style="font-weight:700; color:#60a5fa; cursor:pointer;" onclick="showProfile('${c.authorHandle}')">@${c.authorHandle}</span>:
                <span style="color:#f1f5f9;">${escapeHtml(c.text)}</span>
                <span style="font-size:0.68rem; color:#64748b; margin-left:4px;">${c.time || ''}</span>
              </div>
              ${isMyComment ? `<button class="btn-action-small btn-del-small" style="color:#f87171;" onclick="handleDeleteStoryComment('${s.id}', ${index})">삭제</button>` : ''}
            </div>
          `;
        }).join('');
      }
    }

    async function handleDeleteStory(storyId) {
      const story = loadedStories.find(s => s.id === storyId);
      if (!story || !myProfile || story.authorHandle !== myProfile.handle) {
        return alert("본인이 올린 스토리만 삭제할 수 있습니다.");
      }

      if (confirm("이 스토리를 삭제하시겠습니까?")) {
        await db.collection('stories').doc(storyId).delete();
        closeModal('storyViewerModal');
        updateSystemStatus("스토리 삭제 완료", "#64748b");
      }
    }

    async function handleToggleStoryLike() {
      if (!currentViewingStory || !myProfile) return;
      const sRef = db.collection('stories').doc(currentViewingStory.id);
      const likes = currentViewingStory.likes || [];
      const isLiked = likes.includes(myProfile.handle);

      if (isLiked) {
        await sRef.update({ likes: firebase.firestore.FieldValue.arrayRemove(myProfile.handle) });
      } else {
        await sRef.update({ likes: firebase.firestore.FieldValue.arrayUnion(myProfile.handle) });
      }
    }

    async function handleAddStoryComment(e) {
      e.preventDefault();
      if (!currentViewingStory || !myProfile) return;

      const input = document.getElementById('storyCommentInput');
      const text = input.value.trim();
      if (!text) return;

      const nowStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      await db.collection('stories').doc(currentViewingStory.id).update({
        comments: firebase.firestore.FieldValue.arrayUnion({
          authorHandle: myProfile.handle,
          text: text,
          time: nowStr
        })
      });
      input.value = '';
    }

    async function handleDeleteStoryComment(storyId, commentIndex) {
      const story = loadedStories.find(s => s.id === storyId);
      if (!story || !myProfile) return;

      const targetComment = story.comments[commentIndex];
      if (!targetComment || targetComment.authorHandle !== myProfile.handle) {
        return alert("본인이 작성한 댓글만 삭제할 수 있습니다.");
      }

      if (confirm("스토리 댓글을 삭제하시겠습니까?")) {
        const updatedComments = [...story.comments];
        updatedComments.splice(commentIndex, 1);
        await db.collection('stories').doc(storyId).update({ comments: updatedComments });
        updateSystemStatus("스토리 댓글 삭제 완료", "#64748b");
      }
    }

    // =========================================================================
    // 11. 실시간 톡 기능 (본인 메시지 삭제 지원)
    // =========================================================================
    async function handleSendChat(e) {
      e.preventDefault();
      const input = document.getElementById('chatInput');
      const text = input.value.trim();
      if (!text) return;

      await db.collection('chats').add({
        text: text,
        authorHandle: myProfile.handle,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });
      input.value = '';
    }

    function listenToChats() {
      db.collection('chats').orderBy('createdAt', 'asc').limitToLast(50).onSnapshot(snapshot => {
        const box = document.getElementById('chatMessages');
        box.innerHTML = '';
        snapshot.forEach(doc => {
          const msg = doc.data();
          const isMine = myProfile && myProfile.handle === msg.authorHandle;
          const bubble = document.createElement('div');
          bubble.className = `chat-bubble ${isMine ? 'mine' : 'others'}`;

          if (isMine) {
            bubble.innerHTML = `
              <span>${escapeHtml(msg.text)}</span>
              <button class="chat-del-btn" title="메시지 삭제" onclick="handleDeleteChat('${doc.id}')">✕</button>
            `;
          } else {
            bubble.innerHTML = `
              <div style="font-size:0.75rem; color:var(--text-muted); margin-bottom:2px; cursor:pointer;" onclick="showProfile('${msg.authorHandle}')">@${msg.authorHandle}</div>
              <div>${escapeHtml(msg.text)}</div>
            `;
          }

          box.appendChild(bubble);
        });
        box.scrollTop = box.scrollHeight;
      });
    }

    async function handleDeleteChat(chatId) {
      if (confirm("이 메시지를 삭제하시겠습니까?")) {
        await db.collection('chats').doc(chatId).delete();
        updateSystemStatus("메시지 삭제 완료", "#64748b");
      }
    }

    // =========================================================================
    // 12. 탭 및 공통 모달 유틸리티
    // =========================================================================
    function switchTab(tabKey, btn) {
      document.querySelectorAll('.tab-view').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
      document.getElementById(`tab-${tabKey}`).classList.add('active');
      btn.classList.add('active');
      if (tabKey === 'calendar') renderCalendar();
    }

    function openModal(id) { document.getElementById(id).style.display = 'flex'; }
    function closeModal(id) {
      document.getElementById(id).style.display = 'none';
      if (id === 'storyViewerModal') currentViewingStory = null;
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/[&<>'"]/g, t => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[t] || t));
    }
  </script>
</body>
</html>
